<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#090A12" />
    <meta name="description" content="CinéVault — films et séries VOSTFR sur Chromebook" />
    <meta name="application-name" content="CinéVault" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CinéVault" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>CinéVault</title>
    <style>html,body,#root{margin:0;min-height:100%;background:#090A12;color:#f6f7f8}</style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function show(message) {
          var root = document.getElementById("root");
          if (!root || root.getAttribute("data-booted") === "1") return;
          root.textContent = "";
          var box = document.createElement("div");
          box.setAttribute("role", "alert");
          box.style.cssText = "color:#f6f7f8;font:14px/1.45 system-ui,sans-serif;padding:24px;white-space:pre-wrap";
          box.textContent = message || "Erreur de démarrage";
          root.appendChild(box);
        }
        window.addEventListener("error", function (event) {
          show(event.message || "Erreur de démarrage");
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          show((reason && (reason.message || String(reason))) || "Erreur de démarrage");
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
